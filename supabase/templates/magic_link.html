<h2 style="margin:0 0 12px;font-family:Inter,Arial,sans-serif;color:#1C1917">Sign in to BuildWorthy</h2>
<p style="font-family:Inter,Arial,sans-serif;color:#1C1917">Use either option below — no password needed.</p>
<p style="margin:20px 0">
  <a href="{{ .ConfirmationURL }}"
     style="display:inline-block;padding:10px 18px;background:#4F46E5;color:#ffffff;border-radius:8px;text-decoration:none;font-weight:600;font-family:Inter,Arial,sans-serif">
    Sign in
  </a>
</p>
<p style="font-family:Inter,Arial,sans-serif;color:#1C1917">Or enter this 6-digit code on the sign-in page:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px;margin:8px 0;font-family:Inter,Arial,sans-serif;color:#1C1917">{{ .Token }}</p>
<p style="font-family:Inter,Arial,sans-serif;color:#78716C;font-size:13px">
